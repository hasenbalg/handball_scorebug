services:
  scorebug:
    build: .
    container_name: flask_app
    restart: always
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    expose:
      - "5000"

  redis:
    image: redis:7-alpine
    container_name: redis_server
    volumes:
      - ./redis_data:/data
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - scorebug

